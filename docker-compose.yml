version: "3.9"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: milestone-web:latest
    ports:
      - "8081:80"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    depends_on:
      - api

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: milestone-api:latest
    environment:
      - NODE_ENV=production
      - API_PORT=3000
      - JWT_SECRET=dev_secret_change_me
      - FRONTEND_ORIGIN=http://localhost:8081
      - DATABASE_URL=postgres://postgres:postgres@db:5432/milestone
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=milestone
    ports:
      - "5432:5432"
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: