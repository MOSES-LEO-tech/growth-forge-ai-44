name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: growthforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root deps
        run: npm ci

      - name: Lint
        run: npm run lint || true

      - name: Backend deps
        working-directory: backend
        run: npm ci

      - name: Backend build check
        working-directory: backend
        run: npm run build

      - name: Backend test
        working-directory: backend
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/growthforge_test
          JWT_SECRET: test_secret_key_do_not_use_in_production
          NODE_ENV: test
          FRONTEND_URL: http://localhost:8080
        run: npm test -- --passWithNoTests

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: E2E tests
        env:
          CI: true
        run: npx playwright test tests --reporter=line -j 1 || true
