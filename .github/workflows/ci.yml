name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      CI: true
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      # Canonical Supabase project: tobclczszdikmgvkvngf.
      # Anon/publishable keys are public-by-design (they ship in the client bundle),
      # but they MUST be issued by the canonical project. The previous values were
      # JWTs for xrnnsysvwbbulezhvszb, a project that no longer exists, so every
      # RLS-scoped request they signed was invalid.
      VITE_SUPABASE_URL: https://tobclczszdikmgvkvngf.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Check Supabase secrets
        run: |
          if [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::warning::VITE_SUPABASE_ANON_KEY is unset. The client falls back to the hardcoded project URL, and authenticated E2E specs will self-skip."
          fi
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run TypeScript type check
        run: bun x tsc --noEmit
      - name: Run unit tests
        run: bun run test
      - name: Run build
        run: bun run build
      - name: Install Playwright browsers
        run: bun x playwright install --with-deps chromium
      - name: Run Playwright tests
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/pw-report.json
        run: bun x playwright test --reporter=line --reporter=json
      - name: Fail if every E2E spec skipped
        run: node scripts/ci/assert-playwright-not-all-skipped.mjs test-results/pw-report.json
