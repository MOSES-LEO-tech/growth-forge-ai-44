server {
  listen 80;
  server_name localhost;

  root /usr/share/nginx/html;
  index index.html;

  # Serve static assets directly
  location /assets/ {
    try_files $uri =404;
  }

  # SPA fallback: route all non-file requests to index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}