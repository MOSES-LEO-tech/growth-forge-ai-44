version: '3.8'

services:
  backend-test:
    build:
      context: ./backend
      target: dev
    ports:
      - "3002:3002"
      - "9230:9229"
    environment:
      - PORT=3002
      - DATABASE_URL=postgres://postgres:postgres@db-test:5432/growthforge_test
      - JWT_SECRET=test_secret_key_do_not_use_in_production
      - NODE_ENV=test
      - FRONTEND_URL=http://localhost:8080
    depends_on:
      db-test:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npm run dev

  db-test:
    image: postgres:15
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=growthforge_test
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_test_data:
